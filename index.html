<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Trip Spotto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f2;
      color: #17251c;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .hero {
      text-align: center;
      padding: 30px 10px;
    }

    .hero .emoji {
      font-size: 64px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0 8px;
    }

    .subtitle {
      font-size: 18px;
      color: #617066;
    }

    .start-button {
      display: block;
      width: 100%;
      padding: 20px;
      margin-top: 25px;
      border: none;
      border-radius: 18px;
      background: #ffb703;
      color: #17251c;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #d99500;
    }

    .start-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #d99500;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="hero">
      <div class="emoji">🚗💨</div>

      <h1>Road Trip Spotto</h1>

      <div class="subtitle">
        Who can spot them all?
      </div>

      <button class="start-button">
        🚦 Start Spotto
      </button>
    </div>

  </div>

</body>
</html>
